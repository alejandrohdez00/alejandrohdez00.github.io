# Header navigation
navigation:
  - {title: "About", url: "/"}
  - {title: "Publications", url: "/publications/"}
  - {title: "CV", url: "/cv/"}
  - {title: "Writing", url: "/blog/"}

# Contact links shown in the hero and footer.
# Leave a url empty ("") to hide that entry.
contact:
  - {title: "Email", icon: "mail", url: "mailto:hernandezartiles@mpib-berlin.mpg.de"}
  - {title: "Google Scholar", icon: "scholar", url: "https://scholar.google.com/citations?user=-5D4y-kAAAAJ"}
  - {title: "GitHub", icon: "github", url: "https://github.com/alejandrohdez00"}
  - {title: "LinkedIn", icon: "linkedin", url: "https://www.linkedin.com/in/alejandro-hernandez-artiles/"}
  - {title: "ORCID", icon: "orcid", url: ""}
  - {title: "Bluesky", icon: "bluesky", url: ""}

cv_pdf: /assets/documents/Alejandro_Hernandez_CV.pdf

